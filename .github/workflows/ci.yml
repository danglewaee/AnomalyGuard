name: CI

on:
  push:
    branches: [main, "vn-water-anomaly", "codex/**"]
  pull_request:
    branches: [main, "vn-water-anomaly"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"
      - name: Check Alembic revision graph
        working-directory: backend
        run: alembic -c alembic.ini heads
      - name: Compile backend
        run: python -m compileall backend/app backend/alembic

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Build frontend
        run: |
          cd frontend
          npm run build

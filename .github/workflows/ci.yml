name: CI

on:
  push:
    branches: [main, "vn-water-anomaly", "codex/**"]
  pull_request:
    branches: [main, "vn-water-anomaly"]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      ALLOW_INSECURE_DEFAULTS: "false"
      JWT_SECRET_KEY: anomalyguard-ci-jwt-0123456789abcdef0123456789
      ADMIN_USERNAME: test-admin
      ADMIN_PASSWORD: AnomalyGuardCiAdmin!2026
      DEVICE_API_KEY: anomalyguard-ci-device-key-0123456789
      CORS_ALLOW_ORIGINS: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"
      - name: Check Alembic revision graph
        working-directory: backend
        run: python -m alembic -c alembic.ini heads
      - name: Compile backend
        run: python -m compileall backend/app backend/alembic

  integration:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local secrets
        shell: pwsh
        run: .\scripts\bootstrap-local-secrets.ps1
      - name: Start integration stack
        run: docker compose up -d db redis kafka backend
      - name: Run platform integration smoke
        shell: pwsh
        run: .\scripts\platform-integration-smoke.ps1
      - name: Dump integration stack state
        if: failure()
        run: docker compose ps
      - name: Dump integration service logs
        if: failure()
        run: docker compose logs --no-color db redis kafka backend
      - name: Tear down integration stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Build frontend
        run: |
          cd frontend
          npm run build

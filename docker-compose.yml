services:
  db:
    image: postgres:16
    container_name: anomalyguard-db
    environment:
      POSTGRES_DB: anomalyguard
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomalyguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anomalyguard-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: anomalyguard-backend
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: ./backend
    container_name: anomalyguard-worker
    command: sh -c "alembic upgrade head && celery -A app.celery_app.celery_app worker --loglevel=info"
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: anomalyguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: anomalyguard-db
    environment:
      POSTGRES_DB: anomalyguard
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anomalyguard-redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    container_name: anomalyguard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  kafka:
    image: bitnami/kafka:3.7
    container_name: anomalyguard-kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"

  backend:
    build: ./backend
    container_name: anomalyguard-backend
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mongo
      - kafka

  celery-worker:
    build: ./backend
    container_name: anomalyguard-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - db
      - redis
      - mongo
      - kafka

  frontend:
    build: ./frontend
    container_name: anomalyguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: anomalyguard-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.2
    container_name: anomalyguard-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  mongodata:

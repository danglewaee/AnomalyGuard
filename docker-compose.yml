services:
  db:
    image: postgres:16
    container_name: anomalyguard-db
    environment:
      POSTGRES_DB: anomalyguard
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomalyguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: anomalyguard-redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    container_name: anomalyguard-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build: ./backend
    container_name: anomalyguard-backend
    env_file:
      - backend/.env.example
    environment:
      APP_ENV: development
      ALLOW_INSECURE_DEFAULTS: "false"
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      JWT_SECRET_KEY: anomalyguard-compose-jwt-e8c3190ab8c04730b4e4379237f6fd6d
      ADMIN_USERNAME: ops-admin
      ADMIN_PASSWORD: AnomalyGuardComposeAdmin!2026
      DEVICE_API_KEY: ""
      DEVICE_KEYS_PATH: /app/device-keys.example.json
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENABLE_KAFKA_PUBLISH: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  celery-worker:
    build: ./backend
    container_name: anomalyguard-worker
    command: sh -c "alembic upgrade head && celery -A app.celery_app.celery_app worker --loglevel=info"
    env_file:
      - backend/.env.example
    environment:
      APP_ENV: development
      ALLOW_INSECURE_DEFAULTS: "false"
      DATABASE_URL: postgresql+psycopg://anomaly:anomaly@db:5432/anomalyguard
      JWT_SECRET_KEY: anomalyguard-compose-jwt-e8c3190ab8c04730b4e4379237f6fd6d
      ADMIN_USERNAME: ops-admin
      ADMIN_PASSWORD: AnomalyGuardComposeAdmin!2026
      DEVICE_API_KEY: ""
      DEVICE_KEYS_PATH: /app/device-keys.example.json
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENABLE_KAFKA_PUBLISH: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: anomalyguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
